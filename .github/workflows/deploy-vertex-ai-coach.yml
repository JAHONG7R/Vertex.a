name: Deploy Vertex Functions

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/vertex-ai-coach/**'
      - 'supabase/functions/vertex-send-reminders/**'
      - '.github/workflows/deploy-vertex-ai-coach.yml'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Check Supabase Secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || {
            echo "SUPABASE_ACCESS_TOKEN is missing"
            exit 1
          }

          test -n "$SUPABASE_PROJECT_ID" || {
            echo "SUPABASE_PROJECT_ID is missing"
            exit 1
          }

          echo "Supabase credentials configured."

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest

      - name: Check Supabase CLI
        run: supabase --version

      - name: Deploy AI Coach
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          supabase functions deploy vertex-ai-coach \
            --project-ref "$SUPABASE_PROJECT_ID" \
            --use-api \
            --yes

      - name: Deploy Reminder Function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          supabase functions deploy vertex-send-reminders \
            --project-ref "$SUPABASE_PROJECT_ID" \
            --no-verify-jwt \
            --use-api \
            --yes
