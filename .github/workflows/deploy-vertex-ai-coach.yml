name: Deploy Vertex AI Coach

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/vertex-ai-coach/**'
      - '.github/workflows/deploy-vertex-ai-coach.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check Supabase Secrets
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || exit 1
          test -n "$SUPABASE_PROJECT_ID" || exit 1
          echo "Secrets are present."

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Check CLI
        run: supabase --version

      - name: Deploy AI Coach
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "ERROR: Token missing in deploy step"
            exit 1
          fi

          echo "Token is present in deploy step."

          supabase functions deploy vertex-ai-coach \
            --remote="$SUPABASE_PROJECT_ID" \
            --yes
