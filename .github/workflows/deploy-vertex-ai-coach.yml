name: Deploy Vertex AI Coach

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/vertex-ai-coach/**'
      - '.github/workflows/deploy-vertex-ai-coach.yml'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check Secrets
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || exit 1
          test -n "$SUPABASE_PROJECT_ID" || exit 1
          echo "Secrets are configured."

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest

      - name: Check CLI
        run: supabase --version

      - name: Deploy AI Coach
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          echo "Checking deployment credentials..."

          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Token is missing!"
            exit 1
          fi

          echo "Token is present."

          supabase functions deploy vertex-ai-coach \
            --remote="$SUPABASE_PROJECT_ID" \
            --use-api \
            --yes
