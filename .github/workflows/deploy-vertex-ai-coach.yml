name: Deploy Vertex AI Coach

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/vertex-ai-coach/**'
      - '.github/workflows/deploy-vertex-ai-coach.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check Supabase Secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "ERROR: SUPABASE_ACCESS_TOKEN is missing"
            exit 1
          fi

          if [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "ERROR: SUPABASE_PROJECT_ID is missing"
            exit 1
          fi

          echo "Supabase secrets are configured."

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest

      - name: Check CLI
        run: supabase --version

      - name: Deploy AI Coach
        run: |
          supabase functions deploy vertex-ai-coach \
            --project-ref "$SUPABASE_PROJECT_ID" \
            --use-api \
            --debug \
            --yes
